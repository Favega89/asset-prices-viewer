name: Sync prices

on:
  schedule:
    # Every 15 minutes (UTC). GitHub may delay scheduled runs a few minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm start
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PRICES_DATA_SOURCE_ID: ${{ secrets.NOTION_PRICES_DATA_SOURCE_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
